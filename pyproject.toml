[project]
name = "private-gee"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "openeo-driver", "openeo", "psycopg[binary]>=3.2,<4", "psutil==7.2.2",
  "rasterio>=1.4,<1.5", "pillow>=11", "netCDF4>=1.7", "cdsapi>=0.7",
  "PyYAML>=6", "pytest>=8", "requests>=2.32", "gunicorn>=23"
]

[tool.uv.sources]
openeo-driver = { path = "vendor/openeo-python-driver" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
