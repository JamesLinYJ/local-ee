pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $api_upstream http://api:8080;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /workbench/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
    }
    location ~ ^/openeo/(?:[^/]+/)?credentials/basic/?$ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
    }
    location ~ ^/(openeo|workbench|gee|\.well-known)/ {
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
